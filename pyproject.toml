[project]
name = "mc1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mario Lang", email = "mlangblind.guru" }
]
requires-python = ">=3.12"
dependencies = []

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = ".build/{wheel_tag}"
wheel.packages = ["mc1"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "c++/**/*.{h,c,hpp,cpp}" },
    { file = "mc1/**/*.py" },
    { file = "CMakeLists.txt" },
    { file = "c++/CMakeLists.txt" },
]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "wurlitzer>=3.1.1",
]
